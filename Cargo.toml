[package]
name = "rust-nodes"
version = "0.1.0"
edition = "2024"
description = "A node-based (Blueprint-style) visual editor for Rust: the graph is a view of real Rust code that compiles with cargo."
license = "MIT"
repository = "https://github.com/EilTalrent/rust-nodes"

[dependencies]
serde_json = "1"
eframe = "0.37"
syn = { version = "2", features = ["full", "extra-traits", "printing", "parsing"] }
prettyplease = "0.2"
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
serde = { version = "1", features = ["derive"] }
